<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Конфигуратор дома</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #f7f7f8;
      --fg: #222;
      --accent: #0b7285;
      --accent-strong: #0c8599;
      --accent-weak: rgba(11, 114, 133, 0.15);
      --border: #d0d0d5;
      --header-gradient: linear-gradient(135deg, #0b7285 0%, #1098ad 55%, #74c0fc 100%);
      --page-gradient: linear-gradient(180deg, #f0f4f8 0%, #f7f8fb 38%, #ffffff 100%);
      --panel-gradient: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(244, 249, 252, 0.9) 100%);
    }

    body {
      margin: 0;
      background: var(--page-gradient);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: var(--accent-strong);
    }

    a:hover {
      color: #0c4a6e;
    }

    header {
      padding: 1.15rem 2.5rem;
      background: var(--header-gradient);
      color: white;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      box-shadow: 0 18px 36px rgba(12, 133, 153, 0.25);
    }

    header h1 {
      margin: 0;
      font-size: 1.65rem;
      letter-spacing: -0.01em;
    }

    #status {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.9);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 340px minmax(0, 0.95fr) minmax(480px, 1fr);
      gap: 1.6rem;
      padding: 1.75rem 3rem 2.5rem;
      width: min(1500px, 100%);
      margin: 0 auto;
      box-sizing: border-box;
    }

    .panel {
      background: var(--panel-gradient);
      border: 1px solid rgba(13, 110, 139, 0.12);
      border-radius: 18px;
      padding: 1.25rem;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 0.75rem;
      font-size: 1.15rem;
    }

    #filters-panel,
    #categories-panel,
    #summary-panel {
      min-height: 0;
    }

    .scrollable {
      overflow: auto;
      flex: 1;
      padding-right: 0.6rem;
    }

    .geometry-card {
      border: 1px solid rgba(13, 110, 139, 0.2);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.88);
      padding: 0.85rem 0.95rem 1rem;
      margin-bottom: 1.25rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
      display: grid;
      gap: 0.75rem;
    }

    .geometry-card h3 {
      margin: 0;
      font-size: 1rem;
    }

    .geometry-description {
      font-size: 0.85rem;
      color: #53616f;
      line-height: 1.4;
    }

    .geometry-fields {
      display: grid;
      gap: 0.6rem;
    }

    .geometry-field {
      display: grid;
      gap: 0.3rem;
    }

    .geometry-field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #0b7285;
    }

    .geometry-field input {
      border-radius: 10px;
      border: 1px solid rgba(13, 110, 139, 0.35);
      padding: 0.45rem 0.65rem;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
    }

    .geometry-field input::placeholder {
      color: #94a3b8;
      opacity: 1;
    }

    .geometry-field input.input-error {
      border-color: rgba(224, 49, 49, 0.65);
      box-shadow: inset 0 0 0 1px rgba(224, 49, 49, 0.2);
    }

    .geometry-field.changed label {
      color: #d9480f;
    }

    .geometry-field.changed input {
      border-color: rgba(217, 72, 15, 0.6);
      box-shadow: inset 0 0 0 1px rgba(217, 72, 15, 0.2);
    }

    .geometry-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .geometry-actions button {
      border-radius: 10px;
      border: 1px solid rgba(11, 114, 133, 0.6);
      padding: 0.45rem 0.9rem;
      background: rgba(224, 247, 250, 0.8);
      color: #0b7285;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .geometry-actions button:hover {
      background: rgba(198, 244, 250, 0.95);
    }

    .geometry-note {
      font-size: 0.78rem;
      color: #6b7280;
      line-height: 1.4;
      flex: 1;
      min-width: 160px;
    }

    .search-input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }

    .filter-group {
      margin-bottom: 1.5rem;
    }

    .filter-group h3 {
      font-size: 0.9rem;
      margin: 0 0 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b7280;
    }

    .filter-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-list button {
      border: 1px solid rgba(13, 110, 139, 0.18);
      border-radius: 999px;
      padding: 0.4rem 0.8rem;
      background: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
      font-size: 0.85rem;
      color: #0b7285;
      font-weight: 600;
    }

    .filter-list button:hover {
      border-color: rgba(11, 114, 133, 0.4);
      background: rgba(224, 247, 250, 0.9);
    }

    .filter-list button[aria-pressed="true"] {
      background: linear-gradient(135deg, var(--accent-strong) 0%, #1cb5c9 100%);
      border-color: rgba(11, 114, 133, 0.9);
      color: white;
      transform: translateY(-1px);
    }

    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .toggle-row label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.9rem;
    }

    details.category-block {
      border: 1px solid rgba(13, 110, 139, 0.15);
      border-radius: 14px;
      padding: 0.85rem 1.1rem;
      margin-bottom: 0.9rem;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.92) 0%, rgba(236, 248, 252, 0.88) 100%);
    }

    details.category-block[open] {
      background: linear-gradient(135deg, rgba(224, 247, 250, 0.95) 0%, rgba(226, 246, 255, 0.95) 100%);
      border-color: rgba(11, 114, 133, 0.35);
    }

    details.category-block summary {
      cursor: pointer;
      font-weight: 600;
      list-style: none;
      outline: none;
    }

    details.category-block summary::-webkit-details-marker {
      display: none;
    }

    details.category-block summary::after {
      content: '▸';
      float: right;
      transform: rotate(0deg);
      transition: transform 0.2s ease;
    }

    details.category-block[open] summary::after {
      transform: rotate(90deg);
    }

    .category-placeholder {
      padding: 0.5rem 0 0;
      color: #6b7280;
      font-size: 0.9rem;
    }

    details.category-block.no-match summary {
      opacity: 0.5;
    }

    .options-grid {
      display: grid;
      gap: 0.75rem;
    }

    .option-card {
      border: 1px solid rgba(13, 110, 139, 0.15);
      border-radius: 14px;
      padding: 0.85rem 1.05rem;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(241, 248, 252, 0.92) 100%);
      display: grid;
      gap: 0.55rem;
    }

    .option-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-weak), 0 10px 26px rgba(11, 114, 133, 0.12);
    }

    .option-card.conflict {
      border-color: #e03131;
      box-shadow: 0 0 0 2px rgba(224, 49, 49, 0.15);
    }

    .option-card header {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .option-card h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .option-meta {
      display: grid;
      gap: 0.35rem;
      font-size: 0.86rem;
      color: #475569;
    }

    .option-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: baseline;
    }

    .option-meta-label {
      font-weight: 600;
      color: #0b7285;
    }

    .option-meta-value {
      color: #1f2937;
      font-weight: 500;
    }

    .option-meta-note {
      font-size: 0.8rem;
      color: #64748b;
    }

    .option-quantity-value {
      font-weight: 600;
      color: #0b7285;
    }

    .option-quantity-value.quantity-changed {
      color: #d9480f;
    }

    .option-scale-factor {
      color: #d9480f;
      font-weight: 600;
    }

    .option-description {
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .badge {
      background: rgba(12, 133, 153, 0.12);
      color: #0c4a6e;
      border-radius: 999px;
      padding: 0.25rem 0.65rem;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      border: 1px solid rgba(12, 133, 153, 0.25);
    }

    .completeness-warning {
      color: #a61e4d;
      font-size: 0.85rem;
    }

    .price-table {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.35rem;
      font-size: 0.85rem;
    }

    .price-table div {
      background: rgba(12, 133, 153, 0.08);
      border-radius: 10px;
      padding: 0.45rem 0.55rem;
    }

    .price-table strong {
      display: block;
      font-size: 0.8rem;
      color: #0c4a6e;
      text-transform: uppercase;
    }

    .option-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .option-actions button {
      border-radius: 10px;
      border: 1px solid rgba(11, 114, 133, 0.85);
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, var(--accent-strong) 0%, #1cb5c9 100%);
      color: white;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .option-actions button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(12, 133, 153, 0.2);
    }

    .option-actions button.secondary {
      background: rgba(255, 255, 255, 0.85);
      color: var(--accent);
      border-color: rgba(13, 110, 139, 0.35);
    }

    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      border-radius: 10px;
      border: 1px solid rgba(11, 114, 133, 0.85);
      background: linear-gradient(135deg, var(--accent-strong) 0%, #15aabf 100%);
      color: white;
      padding: 0.6rem 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .primary-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
    }

    .secondary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid rgba(13, 110, 139, 0.28);
      background: rgba(255, 255, 255, 0.85);
      color: var(--accent);
      padding: 0.55rem 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary-button:hover {
      border-color: rgba(11, 114, 133, 0.5);
      background: rgba(224, 247, 250, 0.9);
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .cart-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(13, 110, 139, 0.12);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
      margin-top: 0.25rem;
    }

    .cart-table th,
    .cart-table td {
      padding: 0.55rem 0.6rem;
      text-align: right;
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    }

    .cart-table th:first-child,
    .cart-table td:first-child {
      text-align: left;
    }

    .cart-table tbody tr:last-child td {
      border-bottom: none;
      background: rgba(12, 133, 153, 0.08);
      font-weight: 600;
    }

    #dialog {
      border: none;
      border-radius: 12px;
      padding: 1.5rem;
      max-width: 420px;
      width: calc(100% - 3rem);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.2);
      background: var(--panel-gradient);
    }

    #dialog::backdrop {
      background: rgba(15, 23, 42, 0.35);
    }

    #dialog h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    #dialog p {
      margin: 0.75rem 0 0;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }

    #summary-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    .summary-section {
      background: linear-gradient(160deg, rgba(244, 249, 252, 0.95) 0%, rgba(230, 248, 252, 0.9) 100%);
      border: 1px solid rgba(13, 110, 139, 0.18);
      border-radius: 14px;
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .summary-section h3 {
      margin: 0;
      font-size: 1rem;
    }

    .summary-section table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .summary-section th,
    .summary-section td {
      padding: 0.4rem 0.3rem;
      text-align: right;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    }

    .summary-section th:first-child,
    .summary-section td:first-child {
      text-align: left;
    }

    .summary-section tbody tr:last-child td {
      border-bottom: none;
    }

    .cart-categories {
      display: grid;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .cart-category {
      border: 1px solid rgba(13, 110, 139, 0.18);
      border-radius: 12px;
      padding: 0.65rem 0.75rem;
      background: rgba(255, 255, 255, 0.65);
      display: grid;
      gap: 0.55rem;
    }

    .cart-category-title {
      font-weight: 600;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
    }

    .cart-category-total {
      font-size: 0.85rem;
      color: #0c4a6e;
      font-weight: 600;
    }

    .cart-item-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.45rem;
    }

    .cart-item {
      display: grid;
      gap: 0.4rem;
      border-radius: 12px;
      padding: 0.55rem 0.65rem 0.6rem;
      background: rgba(240, 249, 252, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .cart-item-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .cart-item-name {
      font-weight: 600;
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .cart-remove {
      border: 1px solid rgba(201, 42, 42, 0.4);
      background: rgba(201, 42, 42, 0.08);
      color: #c92a2a;
      font-size: 0.75rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .cart-remove:hover,
    .cart-remove:focus-visible {
      background: rgba(201, 42, 42, 0.16);
      border-color: rgba(201, 42, 42, 0.6);
      color: #a61e4d;
    }

    .cart-item-amount {
      font-size: 0.82rem;
      color: #334155;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: baseline;
      word-break: break-word;
    }

    .cart-item-amount strong {
      font-size: 0.88rem;
      color: #0c4a6e;
    }

    .cart-item-amount small {
      color: #6b7280;
      font-size: 0.75rem;
    }

    .cart-item-quantity {
      font-size: 0.78rem;
      color: #64748b;
    }

    .cart-item-quantity.quantity-changed {
      color: #d9480f;
      font-weight: 600;
    }

    .conflict-block {
      border-radius: 12px;
      padding: 0.6rem 0.75rem;
      background: rgba(224, 49, 49, 0.08);
      border: 1px solid rgba(224, 49, 49, 0.2);
      color: #c92a2a;
    }

    .alert-block {
      border-radius: 10px;
      padding: 0.5rem 0.65rem;
      background: rgba(255, 196, 77, 0.15);
      border: 1px solid rgba(230, 132, 34, 0.3);
      color: #b65c02;
      font-size: 0.82rem;
      margin-top: 0.4rem;
    }

    .conflict-list {
      margin: 0.45rem 0 0;
      padding-left: 1.2rem;
    }

    .info-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.5rem;
    }

    .info-item {
      border: 1px solid rgba(13, 110, 139, 0.18);
      border-radius: 12px;
      padding: 0.6rem 0.75rem;
      background: rgba(255, 255, 255, 0.7);
      overflow-wrap: anywhere;
    }

    .info-item strong {
      display: block;
      font-size: 0.9rem;
      color: #0b7285;
    }

    .info-item ul {
      margin: 0.4rem 0 0;
      padding-left: 1.1rem;
      color: #334155;
      font-size: 0.85rem;
    }

    .info-item ul li + li {
      margin-top: 0.3rem;
    }

    .info-item p {
      margin: 0.35rem 0 0;
      font-size: 0.85rem;
      color: #475569;
    }

    .info-meta {
      font-size: 0.85rem;
      color: #475569;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .range-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 0.4rem;
      font-size: 0.8rem;
    }

    .range-row span {
      display: block;
      background: rgba(15, 118, 110, 0.08);
      border-radius: 8px;
      padding: 0.35rem 0.45rem;
      text-align: center;
      word-break: break-word;
      white-space: normal;
    }

    .range-row span strong {
      display: block;
      color: #0c4a6e;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #totals-footer {
      padding: 2rem 2.5rem 2.5rem;
      background: linear-gradient(180deg, rgba(235, 248, 252, 0.95) 0%, rgba(255, 255, 255, 0.98) 60%);
      border-top: 1px solid rgba(13, 110, 139, 0.15);
    }

    #totals-content {
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(13, 110, 139, 0.12);
      border-radius: 16px;
      padding: 1.2rem 1.4rem;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    #totals-content table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.75rem;
      font-size: 0.9rem;
    }

    #totals-content p {
      margin: 0;
      font-size: 0.92rem;
      color: #0c4a6e;
    }

    #totals-content th,
    #totals-content td {
      border-bottom: 1px solid rgba(148, 163, 184, 0.3);
      padding: 0.5rem 0.3rem;
      text-align: right;
    }

    #totals-content th:first-child,
    #totals-content td:first-child {
      text-align: left;
    }

    #totals-content th {
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      color: #0b7285;
    }

    #totals-content tbody tr:last-child td {
      background: rgba(12, 133, 153, 0.08);
      font-weight: 600;
    }

    @media print {
      body {
        background: white;
        color: #000;
      }
      header,
      #filters-panel,
      .actions-row,
      #auto-section,
      #dialog {
        display: none !important;
      }
      main {
        grid-template-columns: 1fr;
        padding: 0;
      }
      .panel {
        box-shadow: none;
        border: none;
      }
      #categories-panel,
      #summary-panel {
        border: none;
      }
      #totals-footer {
        border-top: none;
      }
    }

    #fallback {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 1rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.6);
    }

    #fallback.dragover {
      border-color: var(--accent);
      background: rgba(11, 114, 133, 0.08);
    }

    #warnings {
      margin: 0;
      padding-left: 1.1rem;
      color: #a61e4d;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <header>
    <h1>Конфигуратор сборки домика</h1>
    <div id="status" role="status">Загрузка данных…</div>
  </header>
  <main>
    <section id="filters-panel" class="panel" aria-label="Фильтры">
      <h2>Фильтры</h2>
      <div id="filters-content" class="scrollable">Данные ещё не загружены.</div>
    </section>
    <section id="categories-panel" class="panel" aria-label="Категории и опции">
      <h2>Опции</h2>
      <div id="categories-content" class="scrollable">Нет данных для отображения.</div>
    </section>
    <section id="summary-panel" class="panel" aria-label="Корзина и сводка">
      <h2>Корзина и справка</h2>
      <div id="summary-wrapper" class="scrollable">
        <section id="cart-section" class="summary-section" aria-live="polite"></section>
        <section id="info-section" class="summary-section"></section>
        <section id="auto-section" class="summary-section"></section>
      </div>
    </section>
  </main>
  <footer id="totals-footer" aria-label="Итоговый свод">
    <div id="totals-content">Выберите опции, чтобы увидеть свод.</div>
  </footer>
  <dialog id="dialog" aria-modal="true"></dialog>
  <script>
    /**
     * @typedef {import('./types').ProjectData} ProjectData
     * временный JSDoc для редакторов, в рантайме не используется
     */

    const STORAGE_KEY = 'house-configurator-v1';

    const GEOMETRY_FIELDS = [
      { key: 'floor_area_m2', label: 'Площадь пола, м²', min: 5, step: 0.1 },
      { key: 'roof_area_m2', label: 'Площадь кровли, м²', min: 5, step: 0.1 },
      { key: 'ext_walls_area_m2', label: 'Площадь наружных стен, м²', min: 5, step: 0.1 },
      { key: 'int_partitions_area_m2', label: 'Площадь внутренних перегородок, м²', min: 0, step: 0.1 },
      { key: 'openings_area_m2', label: 'Площадь проёмов, м²', min: 0, step: 0.1 },
      { key: 'toilet_ceiling_area_m2', label: 'Потолок санузла, м²', min: 0, step: 0.05 },
      { key: 'mezzanine_top_area_m2', label: 'Площадь антресоли, м²', min: 0, step: 0.05 },
    ];

    const GEOMETRY_SCALE_TEXT = {
      floor_area_m2: { area: 'площади пола', perimeter: 'периметру пола' },
      roof_area_m2: { area: 'площади кровли', perimeter: 'периметру кровли' },
      ext_walls_area_m2: { area: 'площади наружных стен', perimeter: 'периметру наружных стен' },
      int_partitions_area_m2: { area: 'площади внутренних перегородок', perimeter: 'периметру внутренних перегородок' },
      openings_area_m2: { area: 'площади проёмов', perimeter: 'периметру проёмов' },
      toilet_ceiling_area_m2: { area: 'площади потолка санузла', perimeter: 'периметру потолка санузла' },
      mezzanine_top_area_m2: { area: 'площади антресоли', perimeter: 'периметру антресоли' },
    };

    const state = {
      rawData: null,
      data: null,
      index: null,
      warnings: [],
      fallbackEnabled: false,
      selection: new Set(),
      mode: 'materials',
      rounding: true,
      filters: {
        categories: new Set(),
        tags: new Set(),
        search: '',
      },
      conflicts: new Map(),
      autoSettings: {
        includeLabor: false,
        includeOverhead: false,
      },
      autoResults: [],
      baseGeometry: {},
      geometryOverrides: {},
      geometry: {},
    };

    const statusEl = document.getElementById('status');
    const filtersContent = document.getElementById('filters-content');
    const categoriesContent = document.getElementById('categories-content');
    const cartContent = document.getElementById('cart-section');
    const infoContent = document.getElementById('info-section');
    const autoContent = document.getElementById('auto-section');
    const totalsContent = document.getElementById('totals-content');
    const dialogEl = document.getElementById('dialog');

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
    });

    /**
     * Выполняет попытку fetch + fallback на ручную загрузку файла.
     */
    async function loadData() {
      updateStatus('Пробую загрузить data.json…');
      try {
        const resp = await fetch('./data.json', { cache: 'no-store' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const text = await resp.text();
        handleDataText(text);
      } catch (err) {
        console.warn('Не удалось получить data.json через fetch:', err);
        enableFallback();
      }
    }

    /**
     * Ставит статус и рендерит предупреждения, если уже есть.
     * @param {string} message
     */
    function updateStatus(message) {
      statusEl.textContent = message;
      renderWarnings();
    }

    /**
     * Обработка текста файла: очистка HTML и парсинг JSON.
     * @param {string} text
     */
    function handleDataText(text) {
      try {
        const cleaned = stripHtmlToJson(text);
        const parsed = JSON.parse(cleaned);
        const normalized = normalizeProjectData(parsed);
        const { warnings, valid } = validateData(normalized);
        state.rawData = normalized;
        state.data = valid ? normalized : null;
        state.baseGeometry = extractGeometry(normalized.geometry);
        state.geometryOverrides = {};
        applyGeometryOverrides();
        state.warnings = warnings;
        if (!valid) {
          filtersContent.innerHTML = '<p>Структура данных не полна, проверьте предупреждения.</p>';
          updateStatus('Ошибка валидации данных');
          return;
        }

        try {
          state.index = buildIndex(state.data);
        } catch (indexError) {
          console.error('Ошибка построения индекса:', indexError);
          state.index = null;
          state.warnings.push('Не удалось подготовить категории и опции. Проверьте целостность JSON.');
          updateStatus('Ошибка подготовки данных');
          return;
        }

        state.fallbackEnabled = false;
        restoreState();
        updateStatus('Данные загружены. Индексы построены.');
        renderFilters();
        renderCategoriesSkeleton();
        renderSummary();
      } catch (error) {
        console.error('Ошибка разбора файла data.json:', error);
        state.data = null;
        state.index = null;
        state.warnings.push('Не удалось разобрать JSON. Убедитесь, что файл содержит корректную структуру.');
        filtersContent.innerHTML = '<p>Произошла ошибка при чтении файла. Проверьте консоль для подробностей.</p>';
        updateStatus('Ошибка чтения данных');
      }
    }

    /**
     * Показывает базовую информацию после успешной загрузки данных.
     */
    function renderDataReadiness() {
      renderFilters();
      renderCategoriesSkeleton();
      renderSummary();
    }

    /**
     * Создаёт карточку управления геометрией.
     */
    function renderGeometryControls() {
      const keys = state.baseGeometry ? Object.keys(state.baseGeometry) : [];
      if (!keys.length) return null;
      const card = document.createElement('section');
      card.className = 'geometry-card';

      const title = document.createElement('h3');
      title.textContent = 'Параметры объекта';
      card.append(title);

      const description = document.createElement('p');
      description.className = 'geometry-description';
      description.textContent = 'Измените площади — конфигуратор автоматически пересчитает материалы, работы и накладные.';
      card.append(description);

      const fields = document.createElement('div');
      fields.className = 'geometry-fields';

      GEOMETRY_FIELDS.forEach((field) => {
        const baseValue = state.baseGeometry[field.key];
        if (typeof baseValue !== 'number') return;
        const wrapper = document.createElement('div');
        wrapper.className = 'geometry-field';
        const label = document.createElement('label');
        label.htmlFor = `geometry-${field.key}`;
        label.textContent = field.label;
        const input = document.createElement('input');
        input.type = 'number';
        input.id = `geometry-${field.key}`;
        input.dataset.key = field.key;
        if (field.min != null) input.min = String(field.min);
        if (field.step != null) input.step = String(field.step);
        input.placeholder = formatGeometryInput(baseValue);
        const override = state.geometryOverrides?.[field.key];
        if (typeof override === 'number' && Number.isFinite(override) && Math.abs(override - baseValue) > 0.0001) {
          input.value = formatGeometryInput(override);
          wrapper.classList.add('changed');
        } else {
          input.value = '';
        }
        input.addEventListener('focus', () => {
          if (input.value === '') {
            input.value = formatGeometryInput(baseValue);
            input.select();
          }
        });
        input.addEventListener('input', (event) => {
          if (!(event.target instanceof HTMLInputElement)) return;
          handleGeometryInput(field.key, event.target);
        });
        input.addEventListener('change', (event) => {
          if (!(event.target instanceof HTMLInputElement)) return;
          handleGeometryInput(field.key, event.target);
        });
        wrapper.append(label, input);
        fields.append(wrapper);
      });

      card.append(fields);

      const actions = document.createElement('div');
      actions.className = 'geometry-actions';
      const resetBtn = document.createElement('button');
      resetBtn.type = 'button';
      resetBtn.textContent = 'Сбросить геометрию';
      resetBtn.addEventListener('click', resetGeometry);
      const note = document.createElement('span');
      note.className = 'geometry-note';
      note.textContent = 'Настройки сохраняются локально и применяются ко всем опциям.';
      actions.append(resetBtn, note);
      card.append(actions);

      return card;
    }

    /**
     * Обрабатывает изменение значения геометрии.
     * @param {string} key
     * @param {HTMLInputElement} input
     */
    function handleGeometryInput(key, input) {
      if (!state.baseGeometry || typeof state.baseGeometry[key] !== 'number') return;
      const raw = input.value.trim();
      const wrapper = input.closest('.geometry-field');
      if (!state.geometryOverrides) state.geometryOverrides = {};
      if (raw === '') {
        delete state.geometryOverrides[key];
        input.value = '';
        wrapper?.classList.remove('changed');
        geometryUpdated();
        return;
      }
      const sanitized = raw.replace(',', '.');
      const value = Number(sanitized);
      const def = GEOMETRY_FIELDS.find((field) => field.key === key);
      const min = def?.min ?? 0;
      if (!Number.isFinite(value) || value < min) {
        input.classList.add('input-error');
        return;
      }
      input.classList.remove('input-error');
      const base = state.baseGeometry[key];
      if (Math.abs(value - base) <= 0.0001) {
        delete state.geometryOverrides[key];
        wrapper?.classList.remove('changed');
      } else {
        state.geometryOverrides[key] = value;
        wrapper?.classList.add('changed');
      }
      input.value = formatGeometryInput(value);
      geometryUpdated();
    }

    /**
     * Сбрасывает геометрию к исходным значениям.
     */
    function resetGeometry() {
      state.geometryOverrides = {};
      geometryUpdated();
    }

    /**
     * Сохраняет и пересчитывает состояние после обновления геометрии.
     */
    function geometryUpdated() {
      applyGeometryOverrides();
      persistState();
      syncOptionCards();
      renderSummary();
      if (state.autoResults.length) {
        runAutoAssembly();
      }
      refreshGeometryInputs();
    }

    /**
     * Рендер фильтров: поиск, категории, теги и базовые переключатели режимов.
     */
    function renderFilters() {
      if (!state.index) return;
      const categories = state.index.categories;
      const tags = state.index.tags;

      const search = document.createElement('input');
      search.type = 'search';
      search.className = 'search-input';
      search.placeholder = 'Поиск по опциям…';
      search.value = state.filters.search;
      search.addEventListener('input', (event) => {
        state.filters.search = event.target.value;
        persistState();
        applyFilters();
      });

      const modeGroup = document.createElement('div');
      modeGroup.className = 'toggle-row';
      modeGroup.innerHTML = `
        <label><input type="radio" name="mode" value="materials" ${state.mode === 'materials' ? 'checked' : ''}> Материалы</label>
        <label><input type="radio" name="mode" value="materials_labor" ${state.mode === 'materials_labor' ? 'checked' : ''}> Материалы + работы</label>
        <label><input type="radio" name="mode" value="materials_labor_overhead" ${state.mode === 'materials_labor_overhead' ? 'checked' : ''}> Материалы + работы + накладные</label>
      `;
      modeGroup.addEventListener('change', (event) => {
        if (event.target instanceof HTMLInputElement) {
          state.mode = event.target.value;
          persistState();
          syncOptionCards();
          renderSummary();
        }
      });

      const roundingLabel = document.createElement('label');
      roundingLabel.className = 'toggle-row';
      roundingLabel.innerHTML = `
        <label><input type="checkbox" id="rounding-toggle" ${state.rounding ? 'checked' : ''}> Округлять до рублей</label>
      `;
      roundingLabel.addEventListener('change', () => {
        const toggle = document.getElementById('rounding-toggle');
        state.rounding = !!toggle?.checked;
        persistState();
        syncOptionCards();
        renderSummary();
      });

      const categoriesGroup = document.createElement('div');
      categoriesGroup.className = 'filter-group';
      categoriesGroup.innerHTML = '<h3>Категории</h3>';
      const catList = document.createElement('ul');
      catList.className = 'filter-list';
      categories.forEach((cat) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = cat.name || cat.id;
        const pressed = state.filters.categories.has(cat.id);
        btn.setAttribute('aria-pressed', String(pressed));
        btn.addEventListener('click', () => {
          if (state.filters.categories.has(cat.id)) {
            state.filters.categories.delete(cat.id);
          } else {
            state.filters.categories.add(cat.id);
          }
          btn.setAttribute('aria-pressed', String(state.filters.categories.has(cat.id)));
          persistState();
          applyFilters();
        });
        catList.append(btn);
      });
      categoriesGroup.append(catList);

      const tagGroup = document.createElement('div');
      tagGroup.className = 'filter-group';
      tagGroup.innerHTML = '<h3>Теги</h3>';
      const tagList = document.createElement('ul');
      tagList.className = 'filter-list';
      tags.forEach((tag) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = tag;
        const pressed = state.filters.tags.has(tag);
        btn.setAttribute('aria-pressed', String(pressed));
        btn.addEventListener('click', () => {
          if (state.filters.tags.has(tag)) {
            state.filters.tags.delete(tag);
          } else {
            state.filters.tags.add(tag);
          }
          btn.setAttribute('aria-pressed', String(state.filters.tags.has(tag)));
          persistState();
          applyFilters();
        });
        tagList.append(btn);
      });
      tagGroup.append(tagList);

      const autoGroup = document.createElement('div');
      autoGroup.className = 'filter-group';
      autoGroup.innerHTML = '<h3>Автосборка</h3>';
      const autoControls = document.createElement('div');
      autoControls.className = 'toggle-row';
      autoControls.style.flexDirection = 'column';

      const laborLabel = document.createElement('label');
      laborLabel.innerHTML = `<input type="checkbox" id="auto-labor" ${state.autoSettings.includeLabor ? 'checked' : ''}> Учитывать работы`;
      const overheadLabel = document.createElement('label');
      overheadLabel.innerHTML = `<input type="checkbox" id="auto-overhead" ${state.autoSettings.includeOverhead ? 'checked' : ''}> Учитывать накладные`;
      autoControls.append(laborLabel, overheadLabel);
      autoGroup.append(autoControls);

      const assembleBtn = document.createElement('button');
      assembleBtn.type = 'button';
      assembleBtn.className = 'primary-button';
      assembleBtn.textContent = 'Собрать 3 комплекта';
      assembleBtn.addEventListener('click', runAutoAssembly);
      autoGroup.append(assembleBtn);

      filtersContent.innerHTML = '';
      const geometryCard = renderGeometryControls();
      if (geometryCard) {
        filtersContent.append(geometryCard);
      }
      filtersContent.append(search, modeGroup, roundingLabel, categoriesGroup, tagGroup, autoGroup);

      const laborToggle = laborLabel.querySelector('input');
      const overheadToggle = overheadLabel.querySelector('input');
      if (overheadToggle) {
        overheadToggle.disabled = !state.autoSettings.includeLabor;
      }
      laborToggle?.addEventListener('change', () => {
        state.autoSettings.includeLabor = !!laborToggle.checked;
        if (!state.autoSettings.includeLabor) {
          state.autoSettings.includeOverhead = false;
          if (overheadToggle) {
            overheadToggle.checked = false;
            overheadToggle.disabled = true;
          }
        } else if (overheadToggle) {
          overheadToggle.disabled = false;
        }
        persistState();
        if (state.autoResults.length) {
          runAutoAssembly();
        } else {
          renderAutoSection();
        }
      });
      overheadToggle?.addEventListener('change', () => {
        state.autoSettings.includeOverhead = !!overheadToggle.checked;
        if (state.autoSettings.includeOverhead) {
          state.autoSettings.includeLabor = true;
          if (laborToggle && !laborToggle.checked) {
            laborToggle.checked = true;
          }
        }
        persistState();
        if (state.autoResults.length) {
          runAutoAssembly();
        } else {
          renderAutoSection();
        }
      });
    }

    /**
     * Создаёт аккордеоны категорий, пока что с заглушками.
     */
    function renderCategoriesSkeleton() {
      if (!state.index) return;
      const openIds = new Set(Array.from(categoriesContent.querySelectorAll('details[open]')).map((node) => node.dataset.categoryId));
      categoriesContent.innerHTML = '';
      state.index.categories.forEach((cat) => {
        const filteredOptions = cat.options.filter(optionMatchesFilters);
        const details = document.createElement('details');
        details.className = 'category-block';
        details.dataset.categoryId = cat.id;
        if (openIds.has(cat.id)) details.open = true;
        if (!filteredOptions.length) {
          details.classList.add('no-match');
        }
        const summary = document.createElement('summary');
        summary.textContent = `${cat.name || 'Без имени'} (${filteredOptions.length}/${cat.options.length})`;
        details.append(summary);
        const placeholder = document.createElement('div');
        placeholder.className = 'category-placeholder';
        placeholder.textContent = filteredOptions.length ? 'Карточки опций загружаются…' : 'Нет опций, подходящих под фильтры.';
        details.append(placeholder);
        details.addEventListener('toggle', () => {
          if (details.open && !details.dataset.loaded) {
            renderCategory(cat, filteredOptions, details, placeholder);
            details.dataset.loaded = 'true';
          }
        });
        categoriesContent.append(details);
        if (details.open && !details.dataset.loaded) {
          renderCategory(cat, filteredOptions, details, placeholder);
          details.dataset.loaded = 'true';
        }
      });
      if (!state.index.categories.length) {
        categoriesContent.innerHTML = '<p>Категории не найдены.</p>';
      }
    }

    /**
     * Применяет фильтры к категориям.
     */
    function applyFilters() {
      renderCategoriesSkeleton();
      syncOptionCards();
    }

    /**
     * Проверяет, проходит ли опция активные фильтры.
     * @param {any} opt
     */
    function optionMatchesFilters(opt) {
      if (state.filters.categories.size && !state.filters.categories.has(opt.category_id)) {
        return false;
      }
      if (state.filters.tags.size) {
        const tags = new Set(opt.tags || []);
        const has = Array.from(state.filters.tags).every((tag) => tags.has(tag));
        if (!has) return false;
      }
      if (state.filters.search) {
        const haystack = `${opt.name || ''} ${opt.description || ''} ${(opt.tags || []).join(' ')}`.toLowerCase();
        const needle = state.filters.search.trim().toLowerCase();
        if (needle && !haystack.includes(needle)) return false;
      }
      return true;
    }

    /**
     * Обновляет правую панель с текущим состоянием.
     */
    function renderSummary() {
      if (!state.index) return;
      renderCart();
      renderInfoPane();
      renderAutoSection();
      renderTotalsFooter();
    }

    /**
     * Обновляет блок корзины с выбранными опциями.
     */
    function renderCart() {
      if (!state.index) return;
      cartContent.innerHTML = '';
      const options = Array.from(state.selection).map((id) => state.index.optionMap.get(id)).filter(Boolean);

      const heading = document.createElement('h3');
      heading.textContent = options.length ? `Выбрано (${options.length}) — ${modeLabel(state.mode)}` : 'Корзина пуста';
      cartContent.append(heading);

      if (!options.length) {
        const hint = document.createElement('p');
        hint.textContent = 'Добавьте опции в средней колонке, чтобы увидеть расчёты.';
        cartContent.append(hint);
        return;
      }

      const { categories, overall } = calcTotals(options, state.mode);

      const table = document.createElement('table');
      table.className = 'cart-table';
      table.innerHTML = `
        <thead>
          <tr><th>Категория</th><th>min</th><th>mid</th><th>max</th></tr>
        </thead>
      `;
      const tbody = document.createElement('tbody');
      categories.forEach((cat) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${cat.name}</td>
          <td>${formatCurrency(cat.total.min)}</td>
          <td>${formatCurrency(cat.total.mid)}</td>
          <td>${formatCurrency(cat.total.max)}</td>
        `;
        tbody.append(row);
      });
      const totalRow = document.createElement('tr');
      totalRow.innerHTML = `
        <td><strong>Итого</strong></td>
        <td><strong>${formatCurrency(overall.min)}</strong></td>
        <td><strong>${formatCurrency(overall.mid)}</strong></td>
        <td><strong>${formatCurrency(overall.max)}</strong></td>
      `;
      tbody.append(totalRow);
      table.append(tbody);
      cartContent.append(table);

      const categoriesContainer = document.createElement('div');
      categoriesContainer.className = 'cart-categories';

      categories.forEach((cat) => {
        const block = document.createElement('article');
        block.className = 'cart-category';

        const title = document.createElement('div');
        title.className = 'cart-category-title';
        title.textContent = cat.name;
        const catTotal = document.createElement('span');
        catTotal.className = 'cart-category-total';
        catTotal.textContent = formatCurrency(cat.total.mid);
        title.append(catTotal);
        block.append(title);

        const list = document.createElement('ul');
        list.className = 'cart-item-list';

        cat.options.forEach(({ option, range }) => {
          const item = document.createElement('li');
          item.className = 'cart-item';

          const headerRow = document.createElement('div');
          headerRow.className = 'cart-item-header';

          const name = document.createElement('span');
          name.className = 'cart-item-name';
          name.textContent = option.name || option.id;

          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'cart-remove';
          removeBtn.setAttribute('aria-label', `Удалить «${option.name || option.id}» из корзины`);
          removeBtn.textContent = 'Удалить';
          removeBtn.addEventListener('click', () => {
            toggleOption(option.id);
          });

          headerRow.append(name, removeBtn);

    /**
     * Выполняет подбор опций в рамках бюджета.
     * @param {number} budget
     * @param {string[]} strategyTags
     * @param {'materials'|'materials_labor'|'materials_labor_overhead'} mode
     */
    function autoAssemble(budget, strategyTags, mode) {
      const selections = new Map();
      let total = emptyRange();
      const missing = [];
      const groups = Array.from(state.index.groups.entries());

      groups.forEach(([groupId, optionIds]) => {
        if (optionIds.some((id) => selections.has(id))) {
          return;
        }
        const candidates = optionIds
          .map((id) => state.index.optionMap.get(id))
          .filter(Boolean)
          .filter(optionMatchesFilters);
        if (!candidates.length) {
          missing.push({ groupId, reason: 'Нет опций по фильтрам' });
          return;
        }
        const scored = candidates
          .map((opt) => {
            const bundle = gatherBundle(opt);
            return {
              opt,
              bundle,
              score: strategyScore(opt, strategyTags),
              cost: calcLine(opt, mode),
            };
          })
          .sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            return a.cost.mid - b.cost.mid;
          });

        let chosen = null;
        for (const candidate of scored) {
          let additional = emptyRange();
          let fits = true;
          candidate.bundle.forEach((id) => {
            if (selections.has(id)) return;
            const depOpt = state.index.optionMap.get(id);
            if (!depOpt) return;
            additional = addRanges(additional, calcLine(depOpt, mode));
          });
          const projected = addRanges(total, additional);
          if (projected.mid <= budget) {
            chosen = candidate;
            break;
          }
        }

        if (!chosen) {
          missing.push({ groupId, reason: 'Бюджет исчерпан' });
          return;
        }

        chosen.bundle.forEach((id) => {
          const opt = state.index.optionMap.get(id);
          if (!opt) return;
          if (!selections.has(id)) {
            selections.set(id, opt);
            total = addRanges(total, calcLine(opt, mode));
          }
        });
      });

      const optionIds = Array.from(selections.keys());
      const options = Array.from(selections.values());
      return { optionIds, options, total, missing, budget };
    }

    /**
     * Собирает зависимые опции.
     * @param {any} opt
     */
    function gatherBundle(opt) {
      const bundle = new Set([opt.id]);
      const stack = [opt.id];
      while (stack.length) {
        const currentId = stack.pop();
        const current = state.index.optionMap.get(currentId);
        if (!current) continue;
        const deps = Array.isArray(current.dependencies) ? current.dependencies : [];
        deps.forEach((depId) => {
          if (!state.index.optionMap.has(depId) || bundle.has(depId)) return;
          bundle.add(depId);
          stack.push(depId);
        });
      }
      return bundle;
    }

    /**
     * Оценивает опцию по стратегическим тегам.
     * @param {any} opt
     * @param {string[]} tags
     */
    function strategyScore(opt, tags) {
      if (!tags.length) return 0;
      const set = new Set(opt.tags || []);
      return tags.reduce((acc, tag, index) => {
        return acc + (set.has(tag) ? tags.length - index : 0);
      }, 0);
    }

    /**
     * Экспорт спецификации в CSV.
     */
    function exportBOMCSV() {
      if (!state.index) return;
      const options = Array.from(state.selection).map((id) => state.index.optionMap.get(id)).filter(Boolean);
      if (!options.length) {
        alert('Нет выбранных опций для экспорта.');
        return;
      }
      const header = ['id', 'name', 'category_id', 'qty', 'unit', 'price_basis', 'materials_mid', 'labor_mid', 'subtotal_mid', 'overhead_mid', 'total_mid'];
      const lines = [header.join(';')];
      options.forEach((opt) => {
        const materials = pickRange(opt, 'materials_total') || estimateFromUnit(opt);
        const labor = pickLaborRange(opt, materials, state.data?.cost_models?.labor?.default_pct ?? 0.3);
        const subtotal = pickRange(opt, 'subtotal') || addRanges(materials, labor);
        const total = pickRange(opt, 'total_with_overhead') || scaleRange(subtotal, 1 + (state.data?.overhead_pct ?? 0.1));
        const overheadAmount = {
          min: total.min - subtotal.min,
          mid: total.mid - subtotal.mid,
          max: total.max - subtotal.max,
        };
        const row = [
          opt.id,
          opt.name || '',
          opt.category_id || '',
          opt.quantity_for_project ?? '',
          opt.unit || '',
          opt.price_unit_basis || '',
          formatNumber(materials.mid),
          formatNumber(labor.mid),
          formatNumber(subtotal.mid),
          formatNumber(overheadAmount.mid),
          formatNumber(total.mid),
        ].map((value) => {
          const str = String(value).replace(/"/g, '""');
          return /[;"\n]/.test(str) ? `"${str}"` : str;
        });
        lines.push(row.join(';'));
      });
      downloadFile('bom.csv', lines.join('\n'), 'text/csv');
    }

    /**
     * Сохраняет файл на диск.
     * @param {string} filename
     * @param {string} content
     * @param {string} mime
     */
    function downloadFile(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    /**
     * Форматирует число для CSV.
     * @param {number} value
     */
    function formatNumber(value) {
      if (value == null || Number.isNaN(value)) return '';
      return Number(value).toFixed(2);
    }

    /**
     * Форматирует значение геометрии для инпута.
     * @param {number} value
     */
    function formatGeometryInput(value) {
      if (value == null || Number.isNaN(value)) return '';
      const abs = Math.abs(value);
      const decimals = abs >= 100 ? 0 : abs >= 10 ? 1 : 2;
      const formatted = value.toFixed(decimals);
      return decimals === 0 ? formatted : formatted.replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
    }

    /**
     * Форматирует метрику площади/количества.
     * @param {number|null|undefined} value
     */
    function formatMeasure(value) {
      if (value == null || Number.isNaN(value)) return '—';
      const abs = Math.abs(value);
      const formatter = new Intl.NumberFormat('ru-RU', {
        minimumFractionDigits: abs >= 100 ? 0 : abs >= 10 ? 1 : 0,
        maximumFractionDigits: abs >= 100 ? 0 : abs >= 10 ? 1 : 2,
      });
      return formatter.format(value);
    }

    /**
     * Локализует текст единиц измерения и подсказок.
     * @param {string} text
     */
    function localizeMeasurementText(text) {
      if (!text) return text;
      let result = String(text);
      const replacements = [
        { pattern: /\bpcs?\b/gi, value: 'шт.' },
        { pattern: /\bpieces?\b/gi, value: 'шт.' },
        { pattern: /\bper\s+room\b/gi, value: 'на помещение' },
        { pattern: /\bper\s+project\b/gi, value: 'на проект' },
        { pattern: /\bper\s+house\b/gi, value: 'на дом' },
        { pattern: /\bsq\.?\s*m\b/gi, value: 'м²' },
        { pattern: /\bsquare\s+meters?\b/gi, value: 'м²' },
        { pattern: /\blinear\s+meters?\b/gi, value: 'погонные метры' },
        { pattern: /\bmeters?\b/gi, value: 'метры' },
        { pattern: /\bmm\b/gi, value: 'мм' },
      ];
      replacements.forEach(({ pattern, value }) => {
        result = result.replace(pattern, value);
      });
      result = result.replace(/\s*·\s*/g, ' • ');
      result = result.replace(/\s{2,}/g, ' ').trim();
      return result;
    }

    /**
     * Строка с количеством для проекта.
     * @param {any} opt
     */
    function formatOptionQuantity(opt) {
      const unit = opt.unit ? localizeMeasurementText(opt.unit) : '';
      const base = typeof opt.quantity_for_project === 'number' ? opt.quantity_for_project : null;
      const current = effectiveQuantity(opt);
      const currentText = current != null ? formatMeasure(current) : base != null ? formatMeasure(base) : null;
      if (!currentText) return unit || '—';
      let text = `${currentText}${unit ? ` ${unit}` : ''}`.trim();
      if (base != null && current != null && Math.abs(current - base) > 0.01) {
        const baseText = `${formatMeasure(base)}${unit ? ` ${unit}` : ''}`.trim();
        text += ` (базово: ${baseText})`;
      }
      return localizeMeasurementText(text);
    }

    /**
     * Форматирует базис расчёта опции.
     * @param {any} opt
     */
    function formatOptionBasis(opt) {
      const basisRaw = typeof opt.price_unit_basis === 'string' ? opt.price_unit_basis.trim() : '';
      const unit = opt.unit ? localizeMeasurementText(opt.unit) : '';
      if (!basisRaw && !unit) return '';
      if (!basisRaw) {
        return localizeMeasurementText(`1 ${unit}`.trim());
      }
      const localizedBasis = localizeMeasurementText(basisRaw);
      if (unit && localizedBasis.toLowerCase().includes(unit.toLowerCase())) {
        return localizedBasis;
      }
      return unit ? `${localizedBasis} (${unit})` : localizedBasis;
    }

    /**
     * Возвращает описание масштабирования для опции.
     * @param {any} opt
     */
    function describeOptionScaling(opt) {
      const hint = detectGeometryHint(opt);
      if (!hint || !hint.key) return null;
      const phrase = geometryScalePhrase(hint);
      if (!phrase) return null;
      const ratio = getQuantityScale(opt);
      const showFactor = Number.isFinite(ratio) && Math.abs(ratio - 1) > 0.01;
      return {
        text: phrase.startsWith('по ') ? phrase : `по ${phrase}`,
        factor: ratio,
        showFactor,
        note: hint.note ? localizeMeasurementText(hint.note) : null,
      };
    }

    /**
     * Форматирует коэффициент масштабирования.
     * @param {number} value
     */
    function formatScaleFactor(value) {
      if (!Number.isFinite(value)) return '1,00';
      return new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
    }

     * Рендерит конкретную категорию, создавая карточки опций.

    /**
     * Создаёт карточку опции с основной информацией.
     * @param {any} opt
     */
    function renderOptionCard(opt) {
      const article = document.createElement('article');
      article.className = 'option-card';

      const header = document.createElement('header');
      const title = document.createElement('h3');

      const quantityLabel = document.createElement('span');
      quantityLabel.className = 'option-meta-label';
      quantityLabel.textContent = 'Текущее количество';

      quantityValue.className = 'option-meta-value option-quantity-value';
      quantityValue.textContent = formatOptionQuantity(opt);
      quantityRow.append(quantityLabel, quantityValue);
      unitInfo.append(quantityRow);

      const basisText = formatOptionBasis(opt);
      if (basisText) {
        const basisRow = document.createElement('div');
        basisRow.className = 'option-meta-row';
        const basisLabel = document.createElement('span');
        basisLabel.className = 'option-meta-label';
        basisLabel.textContent = 'Базис расчёта';
