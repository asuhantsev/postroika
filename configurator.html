        basisValue.className = 'option-meta-value';
        basisValue.textContent = basisText;
        basisRow.append(basisLabel, basisValue);
        unitInfo.append(basisRow);
      }

      const scaling = describeOptionScaling(opt);
      if (scaling) {
        const scaleRow = document.createElement('div');
        scaleRow.className = 'option-meta-row';
        const scaleLabel = document.createElement('span');
        scaleLabel.className = 'option-meta-label';
        scaleLabel.textContent = 'Масштаб';
        const scaleValue = document.createElement('span');
        scaleValue.className = 'option-meta-value';
        scaleValue.textContent = scaling.text;
        if (scaling.showFactor) {
          const factor = document.createElement('span');
          factor.className = 'option-scale-factor';
          factor.textContent = `×${formatScaleFactor(scaling.factor)}`;
          scaleValue.append(' ', factor);
        }
        scaleRow.append(scaleLabel, scaleValue);
        unitInfo.append(scaleRow);
        if (scaling.note) {
          const noteRow = document.createElement('div');
          noteRow.className = 'option-meta-row';
          const noteLabel = document.createElement('span');
          noteLabel.className = 'option-meta-label';
          noteLabel.textContent = 'Примечание';
          const noteValue = document.createElement('span');
          noteValue.className = 'option-meta-note';
          noteValue.textContent = scaling.note;
          noteRow.append(noteLabel, noteValue);
          unitInfo.append(noteRow);
        }
      }

      if (opt.how_to_scale) {
        const hintRow = document.createElement('div');
        hintRow.className = 'option-meta-row';
        const hintLabel = document.createElement('span');
        hintLabel.className = 'option-meta-label';
        hintLabel.textContent = 'Пояснение';
        const hintValue = document.createElement('span');
        hintValue.className = 'option-meta-note';
        hintValue.textContent = localizeMeasurementText(opt.how_to_scale);
        hintRow.append(hintLabel, hintValue);
        unitInfo.append(hintRow);
      }

      header.append(title, unitInfo);

      const description = document.createElement('p');
      description.className = 'option-description';
      description.textContent = opt.description || 'Описание отсутствует.';

      const priceTable = document.createElement('div');
      priceTable.className = 'price-table';

      const badges = document.createElement('div');
      badges.className = 'badge-row';
      (opt.tags || []).forEach((tag) => {
        const span = document.createElement('span');
        span.className = 'badge';
        span.textContent = tag;
        badges.append(span);
      });

      const actions = document.createElement('div');
      actions.className = 'option-actions';
      const toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.addEventListener('click', () => {
        toggleOption(opt.id);
      });
      actions.append(toggleBtn);

      article.append(header, description, priceTable);
      if (badges.childElementCount) {
        article.append(badges);
      }
      article.append(actions);
      if (opt.completeness && opt.completeness !== 'full') {
        const warn = document.createElement('div');
        warn.className = 'completeness-warning';
        warn.textContent = `Данные неполные: ${opt.completeness}`;
        article.append(warn);
      }

      updateOptionCardState(article, opt);
      return article;
    }

    /**
     * Обновляет отображение карточки в соответствии с состоянием.
     * @param {HTMLElement} article
     * @param {any} opt
     */
    function updateOptionCardState(article, opt) {
      const selected = state.selection.has(opt.id);
      article.classList.toggle('selected', selected);
      const conflict = state.conflicts.has(opt.id);
      article.classList.toggle('conflict', conflict);

      const priceTable = article.querySelector('.price-table');
      const priceLine = calcLine(opt, state.mode);
      if (priceTable) {
        priceTable.innerHTML = `
          <div><strong>min</strong>${formatCurrency(priceLine.min)}</div>
          <div><strong>mid</strong>${formatCurrency(priceLine.mid)}</div>
          <div><strong>max</strong>${formatCurrency(priceLine.max)}</div>
        `;
      }

      const quantityValue = article.querySelector('.option-quantity-value');
      if (quantityValue) {
        const label = formatOptionQuantity(opt);
        quantityValue.textContent = label;
        const base = typeof opt.quantity_for_project === 'number' ? opt.quantity_for_project : null;
        const current = effectiveQuantity(opt);
        const changed = base != null && current != null && Math.abs(current - base) > 0.01;
        quantityValue.classList.toggle('quantity-changed', changed);
      }

      const toggleBtn = article.querySelector('.option-actions button');
      if (toggleBtn) {
        toggleBtn.textContent = selected ? 'Убрать' : 'Добавить';
        toggleBtn.classList.toggle('secondary', selected);
      }
    }

    /**
     * Добавляет или убирает опцию, учитывая ограничения и зависимости.
     * @param {string} optionId
     */
    async function toggleOption(optionId) {
      if (!state.index) return;
      const opt = state.index.optionMap.get(optionId);
      if (!opt) return;
      const selected = state.selection.has(optionId);
      if (selected) {
        state.selection.delete(optionId);
        state.conflicts.delete(optionId);
      } else {
        applyConstraint(opt);
        state.selection.add(optionId);
        const ok = await ensureDependencies(opt, new Set([optionId]));
        if (!ok) {
          state.conflicts.set(optionId, collectMissingDependencies(opt));
        } else {
          state.conflicts.delete(optionId);
        }
      }
      persistState();
      syncOptionCards();
      renderSummary();
    }

    /**
     * Радио-поведение для mutually_exclusive_group.
     * @param {any} opt
     */
    function applyConstraint(opt) {
      if (!opt.mutually_exclusive_group || !state.index) return;
      const group = state.index.groups.get(opt.mutually_exclusive_group);
      if (!group) return;
      group.forEach((id) => {
        if (id !== opt.id && state.selection.has(id)) {
          state.selection.delete(id);
          state.conflicts.delete(id);
        }
      });
    }

    /**
     * Показывает модальное подтверждение, совместимое с клавиатурой.
     * @param {{title?:string,message:string,confirmText?:string,cancelText?:string}} options
     * @returns {Promise<boolean>}
     */
    function showConfirm({
      title = 'Требуются зависимости',
      message,
      confirmText = 'Добавить',
      cancelText = 'Оставить без изменений',
    }) {
      if (!dialogEl || typeof dialogEl.showModal !== 'function') {
        return Promise.resolve(window.confirm(message));
      }
      return new Promise((resolve) => {
        const previousActive = document.activeElement;
        dialogEl.innerHTML = '';
        const titleEl = document.createElement('h3');
        titleEl.textContent = title;
        const messageEl = document.createElement('p');
        messageEl.textContent = message;
        const actions = document.createElement('div');
        actions.className = 'dialog-actions';
        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'secondary-button';
        cancelBtn.dataset.action = 'cancel';
        cancelBtn.textContent = cancelText;
        const confirmBtn = document.createElement('button');
        confirmBtn.type = 'button';
        confirmBtn.className = 'primary-button';
        confirmBtn.dataset.action = 'confirm';
        confirmBtn.textContent = confirmText;
        actions.append(cancelBtn, confirmBtn);
        dialogEl.append(titleEl, messageEl, actions);

        const cleanup = (result) => {
          dialogEl.close();
          if (previousActive instanceof HTMLElement) {
            previousActive.focus();
          }
          resolve(result);
        };

        const handleCancel = (event) => {
          event.preventDefault();
          cleanup(false);
        };

        dialogEl.addEventListener('cancel', handleCancel, { once: true });
        cancelBtn.addEventListener('click', handleCancel, { once: true });
        confirmBtn.addEventListener(
          'click',
          (event) => {
            event.preventDefault();
            cleanup(true);
          },
          { once: true },
        );

        dialogEl.showModal();
        confirmBtn.focus();
      });
    }

    /**
     * Обрабатывает зависимости опции.
     * @param {any} opt
     * @param {Set<string>} trail
     */
    async function ensureDependencies(opt, trail) {
      const missing = collectMissingDependencies(opt);
      if (!missing.length) return true;
      const names = missing.map((id) => state.index.optionMap.get(id)?.name || id).join(', ');
      const confirmed = await showConfirm({
        message: `Опция «${opt.name || opt.id}» требует: ${names}. Добавить автоматически?`,
      });
      if (!confirmed) return false;
      missing.forEach((depId) => {
        addOptionWithDependencies(depId, trail);
      });
      return true;
    }

    /**
     * Собирает отсутствующие зависимости для опции.
     * @param {any} opt
     */
    function collectMissingDependencies(opt) {
      if (!Array.isArray(opt.dependencies) || !opt.dependencies.length) return [];
      return opt.dependencies.filter((depId) => !state.selection.has(depId) && state.index.optionMap.has(depId));
    }

    /**
     * Рекурсивно добавляет опцию и её зависимости без повторного подтверждения.
     * @param {string} optionId
     * @param {Set<string>} trail
     */
    function addOptionWithDependencies(optionId, trail) {
      if (trail.has(optionId)) return;
      trail.add(optionId);
      const opt = state.index.optionMap.get(optionId);
      if (!opt) return;
      applyConstraint(opt);
      state.selection.add(optionId);
      const missing = collectMissingDependencies(opt);
      missing.forEach((depId) => addOptionWithDependencies(depId, trail));
      state.conflicts.delete(optionId);
    }

    /**
     * Перерисовывает все карточки согласно текущему состоянию.
     */
    function syncOptionCards() {
      document.querySelectorAll('.option-card').forEach((card) => {
        const id = card.dataset.optionId;
        if (!id) return;
        const opt = state.index?.optionMap.get(id);
        if (!opt) return;
        updateOptionCardState(card, opt);
      });
    }

    /**
     * Рассчитывает суммарные значения по категориям и общий итог.
     * @param {any[]} options
     * @param {'materials'|'materials_labor'|'materials_labor_overhead'} mode
     */
    function calcTotals(options, mode) {
      const categories = new Map();
      let overall = emptyRange();
      options.forEach((opt) => {
        const line = calcLine(opt, mode);
        overall = addRanges(overall, line);
        const catId = opt.category_id;
        const existing = categories.get(catId) || {
          id: catId,
          name: state.index?.categories.find((cat) => cat.id === catId)?.name || catId,
          total: emptyRange(),
          options: [],
        };
        existing.total = addRanges(existing.total, line);
        existing.options.push({ option: opt, range: line });
        categories.set(catId, existing);
      });
      const sorted = Array.from(categories.values()).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ru'));
      return { categories: sorted, overall };
    }

    /**
     * Возвращает диапазоны цен по выбранному режиму.
     * @param {any} opt
     * @param {'materials'|'materials_labor'|'materials_labor_overhead'} mode
     */
    function calcLine(opt, mode) {
      const overheadPct = state.data?.overhead_pct ?? 0.1;
      const defaultLaborPct = state.data?.cost_models?.labor?.default_pct ?? 0.3;
      const quantityScale = getQuantityScale(opt);
      const materialsBase = pickRange(opt, 'materials_total');
      const materials = materialsBase ? scaleRange(materialsBase, quantityScale) : estimateFromUnit(opt);
      const labor = pickLaborRange(opt, materials, quantityScale, defaultLaborPct);
      const subtotalBase = pickRange(opt, 'subtotal');
      const subtotal = subtotalBase ? scaleRange(subtotalBase, quantityScale) : addRanges(materials, labor);
      const totalWithOverheadBase = pickRange(opt, 'total_with_overhead');
      const totalWithOverhead = totalWithOverheadBase
        ? scaleRange(totalWithOverheadBase, quantityScale)
        : scaleRange(subtotal, 1 + overheadPct);

      switch (mode) {
        case 'materials_labor':
          return subtotal;
        case 'materials_labor_overhead':
          return totalWithOverhead;
        default:
          return materials;
      }
    }

    /**
     * Возвращает актуальное количество с учётом геометрии.
     * @param {any} opt
     */
    function effectiveQuantity(opt) {
      const base = typeof opt.quantity_for_project === 'number' ? opt.quantity_for_project : null;
      if (base == null) return null;
      const scale = getQuantityScale(opt);
      const result = base * scale;
      return Number.isFinite(result) && result > 0 ? result : base;
    }

    /**
     * Коэффициент пересчёта количества.
     * @param {any} opt
     */
    function getQuantityScale(opt) {
      const base = typeof opt.quantity_for_project === 'number' ? opt.quantity_for_project : null;
      if (base == null || base === 0) return 1;
      const hint = detectGeometryHint(opt);
      if (!hint) return 1;
      if (!state.baseGeometry || !state.geometry) return 1;

      if (hint.type === 'perimeter') {
        const baseArea = state.baseGeometry.floor_area_m2;
        const currentArea = state.geometry.floor_area_m2;
        if (!baseArea || !currentArea) return 1;
        let ratio = scalePerimeter(baseArea, base, currentArea);
        ratio = applyScalingAdjustments(ratio, hint);
        return Number.isFinite(ratio) && ratio > 0 ? ratio : 1;
      }

      const baseValue = state.baseGeometry[hint.key];
      const currentValue = state.geometry[hint.key];
      if (typeof baseValue !== 'number' || baseValue === 0 || typeof currentValue !== 'number') {
        return 1;
      }
      let ratio = currentValue / baseValue;
      ratio = applyScalingAdjustments(ratio, hint);
      return Number.isFinite(ratio) && ratio > 0 ? ratio : 1;
    }

    /**
     * Корректирует коэффициент с учётом настроек масштабирования.
     * @param {number} ratio
     * @param {{multiplier?:number,offset?:number,min?:number,max?:number}} hint
     */
    function applyScalingAdjustments(ratio, hint) {
      let value = Number.isFinite(ratio) ? ratio : 1;
      const multiplier = typeof hint.multiplier === 'number' && Number.isFinite(hint.multiplier) ? hint.multiplier : 1;
      const offset = typeof hint.offset === 'number' && Number.isFinite(hint.offset) ? hint.offset : 0;
      value *= multiplier;
      if (offset) value += offset;
      if (typeof hint.min === 'number' && Number.isFinite(hint.min)) {
        value = Math.max(value, hint.min);
      }
      if (typeof hint.max === 'number' && Number.isFinite(hint.max)) {
        value = Math.min(value, hint.max);
      }
      return value;
    }

    /**
     * Пытается определить, к какой геометрии привязана опция.
     * @param {any} opt
     */
    function detectGeometryHint(opt) {
      const scaling = normalizeScalingDescriptor(opt.scaling);
      if (scaling) return scaling;
      const text = `${opt.how_to_scale || ''} ${opt.description || ''} ${opt.name || ''}`.toLowerCase();
      if (text.includes('периметр') || text.includes('ростверк')) {
        return { type: 'perimeter', key: 'floor_area_m2' };
      }
      if (text.includes('сануз')) {
        return { type: 'area', key: 'toilet_ceiling_area_m2' };
      }
      if (text.includes('антресол') || text.includes('mezzanin')) {
        return { type: 'area', key: 'mezzanine_top_area_m2' };
      }
      if (text.includes('перегород') || text.includes('внутренн')) {
        return { type: 'area', key: 'int_partitions_area_m2' };
      }
      if (text.includes('наружн') || text.includes('фасад') || text.includes('external wall')) {
        return { type: 'area', key: 'ext_walls_area_m2' };
      }
      if (text.includes('кровл') || text.includes('roof')) {
        return { type: 'area', key: 'roof_area_m2' };
      }
      if (text.includes('проём') || text.includes('проем') || text.includes('окон') || text.includes('двер')) {
        return { type: 'area', key: 'openings_area_m2' };
      }
      if (text.includes('пол') || text.includes('floor')) {
        return { type: 'area', key: 'floor_area_m2' };
      }
      if (opt.category_id === 'foundation' && opt.unit === 'm2') {
        return { type: 'area', key: 'floor_area_m2' };
      }
      return null;
    }

    /**
     * Подбирает фразу для описания масштабирования.
     * @param {{key:string,type:string,label?:string,display?:string}} hint
     */
    function geometryScalePhrase(hint) {
      if (!hint || !hint.key) return '';
      if (hint.display) return hint.display;
      if (hint.label) return hint.label;
      const entry = GEOMETRY_SCALE_TEXT[hint.key];
      if (entry) {
        if (hint.type === 'perimeter' && entry.perimeter) return entry.perimeter;
        if (entry.area) return entry.area;
      }
      const fallback = hint.key.replace(/_/g, ' ').toLowerCase();
      return hint.type === 'perimeter' ? `периметру ${fallback}` : fallback;
    }

    /**
     * Нормализует объект масштабирования из данных.
     * @param {any} scaling
     */
    function normalizeScalingDescriptor(scaling) {
      if (!scaling || typeof scaling !== 'object') return null;
      const key = typeof scaling.geometry_key === 'string'
        ? scaling.geometry_key
        : typeof scaling.key === 'string'
          ? scaling.key
          : null;
      if (!key) return null;
      const methodRaw = typeof scaling.method === 'string'
        ? scaling.method
        : typeof scaling.type === 'string'
          ? scaling.type
          : 'area';
      const method = methodRaw.toLowerCase();
      if (method === 'none' || method === 'fixed') return null;
      const descriptor = {
        type: method === 'perimeter' ? 'perimeter' : 'area',
        key,
      };
      if (typeof scaling.multiplier === 'number' && Number.isFinite(scaling.multiplier)) {
        descriptor.multiplier = scaling.multiplier;
      }
      if (typeof scaling.offset === 'number' && Number.isFinite(scaling.offset)) {
        descriptor.offset = scaling.offset;
      }
      if (typeof scaling.min_multiplier === 'number' && Number.isFinite(scaling.min_multiplier)) {
        descriptor.min = scaling.min_multiplier;
      }
      if (typeof scaling.max_multiplier === 'number' && Number.isFinite(scaling.max_multiplier)) {
        descriptor.max = scaling.max_multiplier;
      }
      if (typeof scaling.label === 'string') {
        descriptor.label = scaling.label;
      }
      if (typeof scaling.display === 'string') {
        descriptor.display = scaling.display;
      } else if (typeof scaling.phrase === 'string') {
        descriptor.display = scaling.phrase;
      }
      if (typeof scaling.note === 'string') {
        descriptor.note = scaling.note;
      } else if (typeof scaling.description === 'string') {
        descriptor.note = scaling.description;
      }
      return descriptor;
    }

    /**
     * Масштабирует периметр при неизменной форме.
     * @param {number} baseArea
     * @param {number} basePerimeter
     * @param {number} newArea
     */
    function scalePerimeter(baseArea, basePerimeter, newArea) {
      if (!baseArea || !basePerimeter || !newArea) return 1;
      if (baseArea <= 0 || basePerimeter <= 0 || newArea <= 0) return 1;
      const halfPerimeter = basePerimeter / 2;
      const discriminant = Math.max(halfPerimeter * halfPerimeter - 4 * baseArea, 0);
      let width0 = (halfPerimeter - Math.sqrt(discriminant)) / 2;
      let length0 = halfPerimeter - width0;
      if (!Number.isFinite(width0) || width0 <= 0 || !Number.isFinite(length0) || length0 <= 0) {
        width0 = Math.sqrt(baseArea);
        length0 = width0;
      }
      const ratio = length0 / (width0 || 1);
      const width1 = Math.sqrt(newArea / (ratio || 1));
      const length1 = ratio * width1;
      const newPerimeter = 2 * (length1 + width1);
      if (!Number.isFinite(newPerimeter) || newPerimeter <= 0) {
        const fallback = Math.sqrt(newArea / baseArea);
        return Number.isFinite(fallback) && fallback > 0 ? fallback : 1;
      }
      return newPerimeter / basePerimeter;
    }

    /**
     * Пустой диапазон значений.
     */
    function emptyRange() {
      return { min: 0, mid: 0, max: 0 };
    }

    /**
     * Форматирует число в валюту с учётом округления.
     * @param {number|null|undefined} value
     */
    function formatCurrency(value) {
      if (value == null || Number.isNaN(value)) return '—';
      const digits = state.rounding ? 0 : 2;
      return new Intl.NumberFormat('ru-RU', {
        style: 'currency',
        currency: 'RUB',
        maximumFractionDigits: digits,
        minimumFractionDigits: digits,
      }).format(value);
    }

    /**
     * Берёт диапазон *_min/_mid/_max, если доступен.
     * @param {any} obj
     * @param {string} prefix
     */
    function pickRange(obj, prefix) {
      const min = obj?.[`${prefix}_min_rub`];
      const mid = obj?.[`${prefix}_mid_rub`];
      const max = obj?.[`${prefix}_max_rub`];
      if ([min, mid, max].every((v) => typeof v === 'number')) {
        return { min, mid, max };
      }
      return null;
    }

    /**
     * Пытается оценить материалы из цены и количества.
     * @param {any} opt
     */
    function estimateFromUnit(opt) {
      const price = pickRange(opt, 'price');
      if (!price) return { min: 0, mid: 0, max: 0 };
      const quantity = effectiveQuantity(opt);
      const fallback = typeof opt.quantity_for_project === 'number' ? opt.quantity_for_project : 1;
      return scaleRange(price, quantity ?? fallback);
    }

    /**
     * Получает диапазон стоимости работ.
     * @param {any} opt
     * @param {{min:number,mid:number,max:number}} materials
     * @param {number} quantityScale
     * @param {number} defaultPct
     */
    function pickLaborRange(opt, materials, quantityScale, defaultPct) {
      if (opt.labor) {
        const labor = pickRange(opt.labor, 'labor_total');
        if (labor) return scaleRange(labor, quantityScale);
        const param = typeof opt.labor.param === 'number' ? opt.labor.param : defaultPct;
        return scaleRange(materials, param);
      }
      return scaleRange(materials, defaultPct);
    }

    /**
     * Приводит значение информационного поля к строке.
     * @param {any} value
     */
    function normalizeInfoValue(value) {
      if (value == null) return '';
      if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') {
        return String(value);
      }
      if (Array.isArray(value)) {
        return value.map((item) => normalizeInfoValue(item)).join('; ');
      }
      if (typeof value === 'object') {
        return Object.entries(value)
          .map(([key, val]) => `${key}: ${normalizeInfoValue(val)}`)
          .join(', ');
      }
      return String(value);
    }

    /**
     * Складывает два диапазона.
     * @param {{min:number,mid:number,max:number}} a
     * @param {{min:number,mid:number,max:number}} b
     */
    function addRanges(a, b) {
      return {
        min: (a?.min || 0) + (b?.min || 0),
        mid: (a?.mid || 0) + (b?.mid || 0),
        max: (a?.max || 0) + (b?.max || 0),
      };
    }

    /**
     * Масштабирует диапазон на коэффициент.
     * @param {{min:number,mid:number,max:number}} range
     * @param {number} factor
     */
    function scaleRange(range, factor) {
      return {
        min: (range?.min || 0) * factor,
        mid: (range?.mid || 0) * factor,
        max: (range?.max || 0) * factor,
      };
    }

    /**
     * Формирует вспомогательные структуры: список категорий, тегов, карт опций.
     * @param {any} data
     */
    function buildIndex(data) {
      const categories = Array.isArray(data.categories) ? data.categories.map((cat) => ({
        id: cat.id,
        name: cat.name,
        options: Array.isArray(cat.options) ? cat.options : [],
      })) : [];
      const optionMap = new Map();
      const groups = new Map();
      const tags = new Set();

      categories.forEach((cat) => {
        cat.options.forEach((opt) => {
          optionMap.set(opt.id, { ...opt, category_id: opt.category_id || cat.id });
          if (Array.isArray(opt.tags)) opt.tags.forEach((tag) => tags.add(tag));
          if (opt.mutually_exclusive_group) {
            const group = groups.get(opt.mutually_exclusive_group) || [];
            group.push(opt.id);
            groups.set(opt.mutually_exclusive_group, group);
          }
        });
      });

      return {
        categories,
        options: Array.from(optionMap.values()),
        optionMap,
        groups,
        tags: Array.from(tags).sort(),
      };
    }

    /**
     * Восстанавливает сохранённое состояние, если оно есть.
     */
    function restoreState() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.selection)) {
          state.selection = new Set(parsed.selection.filter((id) => state.index.optionMap.has(id)));
        }
        if (parsed.mode === 'materials' || parsed.mode === 'materials_labor' || parsed.mode === 'materials_labor_overhead') {
          state.mode = parsed.mode;
        }
        if (typeof parsed.rounding === 'boolean') {
          state.rounding = parsed.rounding;
        }
        if (parsed.filters) {
          if (Array.isArray(parsed.filters.categories)) {
            state.filters.categories = new Set(parsed.filters.categories.filter((id) => state.index.categories.some((cat) => cat.id === id)));
          }
          if (Array.isArray(parsed.filters.tags)) {
            state.filters.tags = new Set(parsed.filters.tags.filter((tag) => state.index.tags.includes(tag)));
          }
          if (typeof parsed.filters.search === 'string') {
            state.filters.search = parsed.filters.search;
          }
        }
        if (parsed.autoSettings) {
          state.autoSettings.includeLabor = !!parsed.autoSettings.includeLabor;
          state.autoSettings.includeOverhead = !!parsed.autoSettings.includeOverhead;
        }
        if (state.baseGeometry) {
          let overrides = {};
          if (parsed.geometryOverrides) {
            overrides = restoreGeometryOverrides(parsed.geometryOverrides, state.baseGeometry);
          } else if (parsed.geometry) {
            overrides = restoreGeometryOverrides(parsed.geometry, state.baseGeometry);
          }
          state.geometryOverrides = overrides;
          applyGeometryOverrides();
        }
      } catch (error) {
        console.warn('Не удалось восстановить сохранённое состояние:', error);
      }
    }

    /**
     * Сохраняет актуальное состояние в localStorage.
     */
    function persistState() {
      try {
        const payload = {
          selection: Array.from(state.selection),
          mode: state.mode,
          rounding: state.rounding,
          filters: {
            categories: Array.from(state.filters.categories),
            tags: Array.from(state.filters.tags),
            search: state.filters.search,
          },
          autoSettings: { ...state.autoSettings },
          geometry: serializeGeometry(state.geometry, state.baseGeometry),
          geometryOverrides: serializeGeometryOverrides(state.geometryOverrides, state.baseGeometry),
        };
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (error) {
        console.warn('Не удалось сохранить состояние:', error);
      }
    }

    /**
     * Читабельное имя режима расчёта.
     * @param {string} mode
     */
    function modeLabel(mode) {
      switch (mode) {
        case 'materials_labor':
          return 'Материалы + работы';
        case 'materials_labor_overhead':
          return 'Материалы + работы + накладные';
        default:
          return 'Материалы';
      }
    }

    /**
     * Создаёт fallback-интерфейс для ручной загрузки файла.
     */
    function enableFallback() {
      if (state.fallbackEnabled) return;
      state.fallbackEnabled = true;
      updateStatus('Загрузка через fetch не удалась. Используйте загрузку файла.');
      const wrapper = document.createElement('div');
      wrapper.id = 'fallback';
      wrapper.innerHTML = `
        <p>Перетащите файл <code>data.json</code> сюда или выберите через диалог.</p>
        <input type="file" id="file-input" accept="application/json,.json,.txt,.html">
      `;
      filtersContent.innerHTML = '';
      filtersContent.append(wrapper);

      const fileInput = wrapper.querySelector('#file-input');
      fileInput.addEventListener('change', (event) => {
        const file = event.target.files?.[0];
        if (file) {
          readFile(file);
        }
      });

      ['dragenter', 'dragover'].forEach((eventName) => {
        wrapper.addEventListener(eventName, (event) => {
          event.preventDefault();
          event.stopPropagation();
          wrapper.classList.add('dragover');
        });
      });

      ['dragleave', 'drop'].forEach((eventName) => {
        wrapper.addEventListener(eventName, (event) => {
          event.preventDefault();
          event.stopPropagation();
          if (eventName === 'drop') {
            const file = event.dataTransfer?.files?.[0];
            if (file) readFile(file);
          }
          wrapper.classList.remove('dragover');
        });
      });
    }

    /**
     * Читает файл и передаёт текст в обработчик.
     * @param {File} file
     */
    function readFile(file) {
      updateStatus(`Читаю ${file.name}…`);
      const reader = new FileReader();
      reader.onload = () => {
        const text = /** @type {string} */ (reader.result || '');
        handleDataText(text);
      };
      reader.onerror = () => {
        console.error('FileReader error:', reader.error);
        updateStatus('Ошибка чтения файла');
      };
      reader.readAsText(file, 'utf-8');
    }

    /**
     * Подготавливает объект геометрии для хранения/восстановления.
     * @param {Record<string, number>|undefined|null} current
     * @param {Record<string, number>|undefined|null} base
     */
    function serializeGeometry(current, base) {
      if (!base) return {};
      const result = {};
      const source = current || {};
      Object.keys(base).forEach((key) => {
        const value = source[key];
        if (typeof value === 'number' && Number.isFinite(value)) {
          result[key] = value;
        }
      });
      return result;
    }

    /**
     * Сохраняет только отличия от базовой геометрии.
     * @param {Record<string, number>|undefined|null} overrides
     * @param {Record<string, number>|undefined|null} base
     */
    function serializeGeometryOverrides(overrides, base) {
      if (!base) return {};
      const result = {};
      const source = overrides || {};
      Object.entries(source).forEach(([key, value]) => {
        const baseValue = base[key];
        if (
          typeof baseValue === 'number'
          && typeof value === 'number'
          && Number.isFinite(value)
          && Math.abs(value - baseValue) > 0.0001
        ) {
          result[key] = value;
        }
      });
      return result;
    }

    /**
     * Восстанавливает отличия геометрии из сохранённого состояния.
     * @param {Record<string, number>|undefined|null} raw
     * @param {Record<string, number>|undefined|null} base
     */
    function restoreGeometryOverrides(raw, base) {
      if (!raw || !base) return {};
      const result = {};
      Object.entries(raw).forEach(([key, value]) => {
        const baseValue = base[key];
        if (
          typeof baseValue === 'number'
          && typeof value === 'number'
          && Number.isFinite(value)
          && Math.abs(value - baseValue) > 0.0001
        ) {
          result[key] = value;
        }
      });
      return result;
    }

    /**
     * Извлекает числовые геометрические параметры из входных данных.
     * @param {any} geometry
     */
    function extractGeometry(geometry) {
      if (!geometry || typeof geometry !== 'object') return {};
      const result = {};
      Object.entries(geometry).forEach(([key, value]) => {
        if (typeof value === 'number' && Number.isFinite(value)) {
          result[key] = value;
        }
      });
      return result;
    }

    /**
     * Применяет текущие оверрайды к базовой геометрии.
     */
    function applyGeometryOverrides() {
      if (!state.baseGeometry || typeof state.baseGeometry !== 'object') {
        state.geometry = {};
        return;
      }
      const computed = { ...state.baseGeometry };
      Object.entries(state.geometryOverrides || {}).forEach(([key, value]) => {
        if (typeof value === 'number' && Number.isFinite(value)) {
          computed[key] = value;
        }
      });
      state.geometry = computed;
    }

    /**
     * Синхронизирует значения инпутов геометрии с текущим состоянием.
     */
    function refreshGeometryInputs() {
      if (!state.baseGeometry) return;
      const inputs = filtersContent.querySelectorAll('.geometry-field input');
      inputs.forEach((input) => {
        const key = input.dataset.key;
        if (!key || typeof state.baseGeometry[key] !== 'number') return;
        const baseValue = state.baseGeometry[key];
        const override = state.geometryOverrides?.[key];
        input.placeholder = formatGeometryInput(baseValue);
        if (typeof override === 'number' && Number.isFinite(override) && Math.abs(override - baseValue) > 0.0001) {
          input.value = formatGeometryInput(override);
          input.classList.remove('input-error');
          input.closest('.geometry-field')?.classList.add('changed');
        } else {
          input.value = '';
          input.classList.remove('input-error');
          input.closest('.geometry-field')?.classList.remove('changed');
        }
      });
    }

    /**
     * Готовит структуру проекта, поднимая ключи из metadata.
     * @param {any} data
     */
    function normalizeProjectData(data) {
      if (!data || typeof data !== 'object') return data;
      const normalized = { ...data };
      const meta = data.metadata && typeof data.metadata === 'object' ? data.metadata : null;
      if (meta) {
        if (meta.geometry && !normalized.geometry) {
          normalized.geometry = meta.geometry;
        }
        if (meta.cost_models && !normalized.cost_models) {
          normalized.cost_models = meta.cost_models;
        }
        if (typeof meta.overhead_pct === 'number' && normalized.overhead_pct == null) {
          normalized.overhead_pct = meta.overhead_pct;
        }
        if (meta.notes && normalized.notes == null) {
          normalized.notes = meta.notes;
        }
      }
      return normalized;
    }

    /**
     * Удаляет HTML-обёртку, возвращая JSON-строку.
     * @param {string} text
     */
    function stripHtmlToJson(text) {
      const trimmed = text.trim();
      if (!trimmed.startsWith('<')) return text;

      let extracted = trimmed;
      if (typeof DOMParser !== 'undefined') {
        try {
          const doc = new DOMParser().parseFromString(trimmed, 'text/html');
          if (doc && doc.body) {
            extracted = doc.body.textContent || trimmed;
          }
        } catch (error) {
          console.warn('DOMParser parsing failed, fallback to regex cleanup.', error);
        }
      }

      const looksLikeJson = extracted && extracted.includes('{') && extracted.includes('}');
      if (!looksLikeJson || extracted === trimmed) {
        extracted = trimmed
          .replace(/<style[\s\S]*?<\/style>/gi, '')
          .replace(/<script[\s\S]*?<\/script>/gi, '')
          .replace(/<[^>]+>/g, '\n');
      }

      const firstBrace = extracted.indexOf('{');
      const lastBrace = extracted.lastIndexOf('}');
      if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
        extracted = extracted.slice(firstBrace, lastBrace + 1);
      }

      return extracted
        .replace(/\u00a0|&nbsp;|&#160;/g, ' ')
        .replace(/&quot;/g, '"')
        .replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/\r/g, '')
        .split('\n')
        .map((line) => line.trim())
        .filter((line, index, array) => {
          if (!line) return false;
          if (index === 0) return true;
          return !(line === ',' && array[index - 1] === ',');
        })
        .join('\n')
        .trim();
    }

    /**
     * Проверяет структуру данных, возвращая список предупреждений.
     * @param {any} data
     */
    function validateData(data) {
      const warnings = [];
      if (!data || typeof data !== 'object') {
        warnings.push('Данные не являются объектом.');
        return { valid: false, warnings };
      }
      const requiredTop = ['geometry', 'cost_models', 'overhead_pct'];
      requiredTop.forEach((key) => {
        if (!(key in data)) warnings.push(`Отсутствует ключ ${key}.`);
      });
      if (!Array.isArray(data.categories) || !data.categories.length) {
        warnings.push('Массив categories отсутствует или пуст.');
      }
      return { valid: warnings.length === 0, warnings };
    }

    /**
     * Показывает список предупреждений под статусом.
     */
    function renderWarnings() {
      let list = document.getElementById('warnings');
      if (!list) {
        list = document.createElement('ul');
        list.id = 'warnings';
        statusEl.insertAdjacentElement('afterend', list);
      }
      list.innerHTML = '';
      state.warnings.forEach((warn) => {
        const li = document.createElement('li');
        li.textContent = warn;
        list.appendChild(li);
      });
      list.classList.toggle('hidden', state.warnings.length === 0);
    }
  </script>
</body>
